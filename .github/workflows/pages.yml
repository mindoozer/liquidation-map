name: refresh-and-deploy

# Refresh venue data + render the map, then publish to GitHub Pages.
on:
  schedule:
    - cron: '12 * * * *'   # hourly at :12 UTC
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Fetch venue data (public APIs, no keys)
        run: node fetch.mjs
      - name: Render liquidation map
        run: node render.mjs
      - name: Assemble site (index.html)
        run: mkdir -p dist && cp liquidation-map.html dist/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
